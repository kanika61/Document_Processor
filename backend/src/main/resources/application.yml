server:
  port: 8080

spring:
  application:
    name: document-processor
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:document_processor}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

document-processing:
  max-retry-attempts: 3
  retry-backoff-ms: 1000
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
  storage:
    base-path: ./uploaded-documents

logging:
  level:
    com.suretyseven.documentprocessor: INFO
